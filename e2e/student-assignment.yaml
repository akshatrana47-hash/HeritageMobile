# Assignment: draft -> submit (upload failure then retry) -> persisted receipt
appId: org.reactjs.native.example.HeritageMobile
---
- tapOn:
    id: "tab-courses"
- tapOn:
    id: "courses-assignments"
- extendedWaitUntil:
    visible:
      id: "assignments-screen"
    timeout: 15000
- tapOn:
    id: "assignment-as_acsw_q2"
- extendedWaitUntil:
    visible:
      id: "assignment-details"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "attachment-add"
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "Attach your completed exam document above to enable submission."
- tapOn:
    id: "attachment-add"
# iOS document picker (native UI) — pick the first file visible, or cancel
- extendedWaitUntil:
    visible:
      text: "Cancel"
    timeout: 15000
- tapOn:
    text: "Cancel"
- assertVisible:
    text: "Picker cancelled"
